# #343, #322, #227: a read-only editor without autofocus still becomes ready
# and shows its initial content, with no user interaction.
appId: ${APP_ID}
env:
  APP_ID: ${APP_ID || 'com.examplelatest'}
name: 'Repro: read-only editor becomes ready'
tags:
  - repro
---
- launchApp:
    clearState: true
- scrollUntilVisible:
    element: 'Repro: Readiness'
    timeout: 60000
- tapOn: 'Repro: Readiness'
- extendedWaitUntil:
    visible:
      id: editor-status
      text: 'ready:true editable:false.*'
    timeout: 15000
- assertVisible: 'Read-only content loaded'
- tapOn:
    id: read-editor-state
- assertVisible:
    id: editor-html
    text: '<p>Read-only content loaded</p>'
