// The host app provides the Android Gradle Plugin; this library adds no
// buildscript classpath and no Kotlin plugin, so it works with AGP 8 and 9.

def isNewArchitectureEnabled() {
  return rootProject.hasProperty("newArchEnabled") && rootProject.getProperty("newArchEnabled") == "true"
}

def safeExtGet(name, fallback) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : fallback
}

apply plugin: "com.android.library"

if (isNewArchitectureEnabled()) {
  apply plugin: "com.facebook.react"

  react {
    jsRootDir = file("../src/specs")
    libraryName = "RNTenTapSpec"
    codegenJavaPackageName = "com.tentap"
  }
}

android {
  namespace "com.tentap"
  compileSdk safeExtGet("compileSdkVersion", 35)

  defaultConfig {
    minSdk safeExtGet("minSdkVersion", 24)
    buildConfigField "boolean", "IS_NEW_ARCHITECTURE_ENABLED", isNewArchitectureEnabled().toString()
  }

  buildFeatures {
    buildConfig true
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  lint {
    abortOnError false
  }

  sourceSets {
    main {
      java.srcDirs += isNewArchitectureEnabled() ? ["src/newarch"] : ["src/oldarch"]
    }
  }
}

repositories {
  mavenCentral()
  google()
}

dependencies {
  // The version comes from the host app's React Native Gradle Plugin.
  implementation "com.facebook.react:react-android"
  implementation "androidx.core:core:1.13.1"

  testImplementation "junit:junit:4.13.2"
}
