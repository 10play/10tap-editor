name: ALPHA CD
on:
  push:
    paths:
      - 'src/**'
      - 'ios/**'
      - 'android/**'
      - 'package.json'
      - 'tentap.podspec'
    branches:
      - alpha

concurrency:
  group: release-alpha
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"

      - name: Setup
        uses: ./.github/actions/setup

      - name: Authenticate with npm
        run: npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      # release-it bumps the prerelease version once and publishes under the
      # `alpha` dist-tag; npm publish runs prepack and prepare.
      - name: Release
        run: yarn release --ci --preRelease=alpha
        env:
          NPM_CONFIG_PROVENANCE: true
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
