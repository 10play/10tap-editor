name: CD
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'ios/**'
      - 'android/**'
      - 'package.json'
      - 'tentap.podspec'
    branches:
      - main

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"

      - name: Setup
        uses: ./.github/actions/setup

      # Trusted publishing needs npm 11.5.1+. Node 22 ships an older npm.
      # No NPM_TOKEN: npm uses the GitHub OIDC token for this workflow.
      - name: Install npm for trusted publishing
        run: npm install --global npm@^11.5.1

      # npm publish runs prepack (editor and web utils) and then prepare (lib).
      - name: Release
        run: yarn release --ci
        env:
          NPM_CONFIG_PROVENANCE: true
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
