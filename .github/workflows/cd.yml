name: CD
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'ios/**'
      - 'android/**'
      - 'package.json'
      - 'tentap.podspec'
    branches:
      - main

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"

      - name: Setup
        uses: ./.github/actions/setup

      # Trusted publishing needs npm 11.5.1+. Node 22 ships an older npm.
      # No NPM_TOKEN: npm uses the GitHub OIDC token for this workflow.
      - name: Install npm for trusted publishing
        run: npm install --global npm@^11.5.1

      # The hoisted conventional-changelog-conventionalcommits 7.x preset never
      # calls the callback release-it's 3.x loader waits on, so release-it exits
      # before it publishes. 4.6.3, nested under conventional-changelog, still does.
      - name: Use the changelog preset release-it can finish
        run: |
          mkdir -p node_modules/conventional-changelog-preset-loader/node_modules
          ln -sfn ../../conventional-changelog/node_modules/conventional-changelog-conventionalcommits \
            node_modules/conventional-changelog-preset-loader/node_modules/conventional-changelog-conventionalcommits

      # npm publish runs prepack (editor and web utils) and then prepare (lib).
      - name: Release
        run: node ./node_modules/release-it/bin/release-it.js --ci --npm.skipChecks
        env:
          NPM_CONFIG_PROVENANCE: true
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
