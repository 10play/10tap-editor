name: Release now
on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"

      - name: Setup
        uses: ./.github/actions/setup

      # Trusted publishing needs npm 11.5.1+. Node 22 ships an older npm.
      # No NPM_TOKEN: npm uses the GitHub OIDC token for this workflow.
      - name: Install npm for trusted publishing
        run: npm install --global npm@^11.5.1

      # package.json is already 1.1.0, so do not bump it again.
      - name: Release
        run: yarn release --ci --no-increment
        env:
          NPM_CONFIG_PROVENANCE: true
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
