name: Test deployment

on:
  pull_request:
    branches:
      - main
    paths:
      - 'website/**'

permissions:
  contents: read

jobs:
  test-deploy:
    name: Test deployment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup
        uses: ./.github/actions/setup

      - name: Test build website
        run: yarn workspace website build
