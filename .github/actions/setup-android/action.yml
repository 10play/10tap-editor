name: Setup Android
description: Set up JDK 17 and Gradle caching for the example app builds

runs:
  using: composite
  steps:
    - name: Setup JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
