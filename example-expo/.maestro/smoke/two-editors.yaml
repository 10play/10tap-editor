# Two editors on one screen keep their own content.
appId: dev.tenplay.tentapexampleexpo
name: Two editors
tags:
  - smoke
---
- runFlow:
    file: ../common/open-example.yaml
    env:
      EXAMPLE: Two Editors
- extendedWaitUntil:
    visible: Second editor
    timeout: 20000
- tapOn: Second editor
- waitForAnimationToEnd
- inputText: ' two '
- assertVisible: '.* two .*'
- tapOn: First editor
- waitForAnimationToEnd
- inputText: ' one '
- assertVisible: '.* one .*'
- assertNotVisible: '.* one .* two .*'
- assertNotVisible: '.* two .* one .*'
