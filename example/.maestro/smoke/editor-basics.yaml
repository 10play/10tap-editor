# Editor basics: the editor becomes ready, takes typing and formatting, and
# undo reverts the formatted text.
appId: ${APP_ID}
env:
  APP_ID: ${APP_ID || 'dev.tenplay.tentapexample'}
name: Editor basics
tags:
  - smoke
---
- runFlow: ../subflows/launch.yaml
- scrollUntilVisible:
    element: 'E2E: Smoke'
    timeout: 60000
- tapOn: 'E2E: Smoke'
- extendedWaitUntil:
    visible:
      id: editor-status
      text: 'ready:true editable:true.*'
    timeout: 15000
- assertVisible: 'Smoke test'
- tapOn:
    id: smoke-editor
- waitForAnimationToEnd
- inputText: ' typed'
- tapOn:
    id: toggle-bold
- inputText: ' bold'
- tapOn:
    id: read-editor-state
- assertVisible:
    id: editor-html
    text: '.*typed.*<strong>.*bold</strong>.*'
- tapOn:
    id: undo
- tapOn:
    id: read-editor-state
- assertVisible:
    id: editor-html
    text: '.*Smoke test.*'
- assertNotVisible:
    id: editor-html
    text: '.*bold</strong>.*'
