# Android back closes an open custom keyboard without showing the system
# keyboard and is consumed, so the screen stays. Tapping the editor then
# types normally again.
appId: ${APP_ID}
env:
  APP_ID: ${APP_ID || 'dev.tenplay.tentapexample'}
name: Android back dismisses the custom keyboard
---
- launchApp:
    clearState: true
- runFlow:
    when:
      platform: Android
    commands:
      - extendedWaitUntil:
          visible: '10Tap Rich Text Editor!'
          timeout: 60000
      # The entry can be below the fold on smaller screens.
      - scrollUntilVisible:
          element: 'Keyboard: Custom'
          timeout: 60000
      - tapOn: 'Keyboard: Custom'
      - tapOn:
          id: keyboard-example-editor
      - waitForAnimationToEnd
      # On a cold start the keyboard can begin rising after the wait above
      # returns, and the switcher rides up with it; give it time to arrive so
      # the toggle tap is not aimed at where the switcher was.
      - extendedWaitUntil:
          visible: 'keyboard-settle-never-shown'
          timeout: 2500
          optional: true
      - tapOn:
          id: toggle-sticker-keyboard
      - assertVisible:
          id: sticker-0
      - back
      - waitForAnimationToEnd
      - assertNotVisible:
          id: sticker-0
      - assertVisible:
          id: keyboard-example-editor
      - tapOn:
          id: keyboard-example-editor
      - waitForAnimationToEnd
      - inputText: 'after back'
      - tapOn:
          id: read-editor-state
      - assertVisible:
          id: editor-html
          text: '.*after back.*'
