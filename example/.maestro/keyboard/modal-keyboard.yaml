# An editor inside a Modal. On Android the Modal is its own window, so the
# keyboard runs on the fallback driver there; the flow is the same.
appId: ${APP_ID}
env:
  APP_ID: ${APP_ID || 'dev.tenplay.tentapexample'}
name: Custom keyboard inside a Modal
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: '10Tap Rich Text Editor!'
    timeout: 60000
# The entry can be below the fold on smaller screens.
- scrollUntilVisible:
    element: 'Keyboard: Modal'
    timeout: 60000
- tapOn: 'Keyboard: Modal'
- tapOn:
    id: open-editor-modal
- tapOn:
    id: keyboard-example-editor
- waitForAnimationToEnd
# On a cold start the keyboard can begin rising after the wait above
# returns, and the switcher rides up with it; give it time to arrive so
# the toggle tap is not aimed at where the switcher was.
- extendedWaitUntil:
    visible: 'keyboard-settle-never-shown'
    timeout: 2500
    optional: true
- tapOn:
    id: toggle-color-keyboard
- assertVisible: Highlight
- tapOn:
    text: Red
    index: 0
- waitForAnimationToEnd
- assertNotVisible: Highlight
- inputText: ' modal'
- tapOn:
    id: read-editor-state
- assertVisible:
    id: editor-html
    text: '.*color.*modal.*'
- assertNotVisible: '.*driver failed.*'
- tapOn:
    id: close-editor-modal
