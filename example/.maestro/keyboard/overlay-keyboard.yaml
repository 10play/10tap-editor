# layout="overlay" with EditorKeyboardAvoidingView (and 'stable' mode on
# Android): the keyboard opens over the window, the switcher above it stays
# reachable, and typing works after it closes back to the system keyboard.
appId: ${APP_ID}
env:
  APP_ID: ${APP_ID || 'dev.tenplay.tentapexample'}
name: Overlay custom keyboard
---
- runFlow: ../subflows/launch.yaml
# The entry can be below the fold on smaller screens.
- scrollUntilVisible:
    element: 'Keyboard: Overlay'
    timeout: 60000
- tapOn: 'Keyboard: Overlay'
- tapOn:
    id: keyboard-example-editor
- waitForAnimationToEnd
# On a cold start the keyboard can begin rising after the wait above
# returns, and the switcher rides up with it; give it time to arrive so
# the toggle tap is not aimed at where the switcher was.
- extendedWaitUntil:
    visible: 'keyboard-settle-never-shown'
    timeout: 2500
    optional: true
- tapOn:
    id: toggle-color-keyboard
- assertVisible: Highlight
- assertVisible:
    id: toggle-color-keyboard
- tapOn:
    text: Blue
    index: 0
- waitForAnimationToEnd
- assertNotVisible: Highlight
- inputText: ' overlay'
- tapOn:
    id: read-editor-state
- assertVisible:
    id: editor-html
    text: '.*color.*overlay.*'
