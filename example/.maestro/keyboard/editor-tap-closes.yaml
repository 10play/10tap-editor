# Tapping the editor while a custom keyboard is open brings the system
# keyboard back (closeOnEditorPress).
appId: ${APP_ID}
env:
  APP_ID: ${APP_ID || 'dev.tenplay.tentapexample'}
name: Editor tap closes the custom keyboard
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: '10Tap Rich Text Editor!'
    timeout: 60000
# The entry can be below the fold on smaller screens.
- scrollUntilVisible:
    element: 'Keyboard: Custom'
    timeout: 60000
- tapOn: 'Keyboard: Custom'
- tapOn:
    id: keyboard-example-editor
- waitForAnimationToEnd
- tapOn:
    id: toggle-sticker-keyboard
- assertVisible:
    id: sticker-0
# The editor view reaches under the custom keyboard, so its center can land on
# the keyboard switcher; tap the text instead.
- tapOn: 'Pick a sticker or a color.'
- waitForAnimationToEnd
- assertNotVisible:
    id: sticker-0
- inputText: 'x'
- tapOn:
    id: read-editor-state
- assertVisible:
    id: editor-html
    text: '.*x.*'
