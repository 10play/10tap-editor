# Switching from one custom keyboard to another swaps the body only, and
# closing afterwards still brings the system keyboard back to the editor.
appId: ${APP_ID}
env:
  APP_ID: ${APP_ID || 'dev.tenplay.tentapexample'}
name: Switch between custom keyboards
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: '10Tap Rich Text Editor!'
    timeout: 60000
# The entry can be below the fold on smaller screens.
- scrollUntilVisible:
    element: 'Keyboard: Custom'
    timeout: 60000
- tapOn: 'Keyboard: Custom'
- tapOn:
    id: keyboard-example-editor
- waitForAnimationToEnd
- tapOn:
    id: toggle-sticker-keyboard
- assertVisible:
    id: sticker-0
- tapOn:
    id: toggle-color-keyboard
- assertVisible: Highlight
- assertNotVisible:
    id: sticker-0
- tapOn:
    id: toggle-color-keyboard
- waitForAnimationToEnd
- assertNotVisible: Highlight
- inputText: 'switched'
- tapOn:
    id: read-editor-state
- assertVisible: 'mounts:1 unmounts:1'
- assertVisible:
    id: editor-html
    text: '.*switched.*'
